<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo beheerpaneel | StrakWerk</title>
<meta name="description" content="Probeer zelf hoe het beheerpaneel van StrakWerk werkt: pas teksten, foto's, openingstijden en producten aan en zie je website direct veranderen.">
<meta name="theme-color" content="#0B0E13">
<link rel="canonical" href="https://www.strakwerkk.nl/demo">
<meta property="og:type" content="website">
<meta property="og:title" content="Probeer het beheerpaneel van StrakWerk">
<meta property="og:description" content="Pas zelf teksten, foto's en producten aan en zie je website direct veranderen. Geen account nodig.">
<meta property="og:image" content="https://www.strakwerkk.nl/assets/og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B0E13'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='900' font-size='15' fill='%23E8EDF3' text-anchor='middle'%3ESW%3C/text%3E%3Crect x='7' y='24' width='12' height='2.4' rx='1.2' fill='%23CFAE69'/%3E%3C/svg%3E">
<link rel="preload" href="/assets/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<script defer src="/_vercel/insights/script.js"></script>
<style>
:root{
  --bg:#0B0E13; --bg-2:#0F1319; --card:#141922; --card-2:#1A202B; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --text:#E8EDF3; --muted:#98A2B0; --gold:#CFAE69; --gold-hi:#EAD39C; --gold-ink:#17130B; --ok:#5BD39A; --warn:#F0A35E; --bad:#F07A7A;
  --f:"Geist", system-ui, -apple-system, "Segoe UI", sans-serif; --mono:"Geist Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--text); font:15px/1.5 var(--f); -webkit-font-smoothing:antialiased; overflow:hidden}
a{color:inherit; text-decoration:none}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:6px}
::selection{background:var(--gold); color:var(--gold-ink)}

/* Topbalk */
.dtop{height:64px; display:flex; align-items:center; gap:14px; padding:0 18px; border-bottom:1px solid var(--line); background:rgba(11,14,19,.92); position:relative; z-index:20}
.brand{font-weight:800; letter-spacing:.06em; font-size:19px; display:inline-flex; gap:4px; line-height:1}
.brand .strak{position:relative}
.brand .strak::after{content:""; position:absolute; left:0; right:0; height:2.5px; border-radius:2px; background:var(--gold); bottom:-6px}
.pill{font:700 .68rem/1 var(--f); letter-spacing:.1em; text-transform:uppercase; padding:6px 9px; border-radius:99px; background:rgba(207,174,105,.14); color:var(--gold)}
.seg{display:flex; gap:3px; padding:3px; border-radius:99px; border:1px solid var(--line-2); background:rgba(255,255,255,.02); margin-left:8px}
.seg button{border:0; background:none; padding:7px 13px; border-radius:99px; font-weight:600; font-size:.84rem; color:var(--muted); cursor:pointer; white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--gold); color:var(--gold-ink)}
.seg small{opacity:.75; font-weight:500; margin-left:4px}
.sp{flex:1}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 15px; border-radius:10px; border:1px solid var(--line-2); background:rgba(255,255,255,.03); font-weight:700; font-size:.86rem; cursor:pointer; white-space:nowrap; transition:border-color .2s, background .2s}
.btn:hover{border-color:rgba(255,255,255,.3)}
.btn--gold{background:var(--gold); border-color:var(--gold); color:var(--gold-ink)}
.btn--gold:hover{background:var(--gold-hi); border-color:var(--gold-hi)}
.btn svg{width:16px; height:16px}
.back{color:var(--muted); font-weight:600; font-size:.86rem}
.back:hover{color:var(--text)}

/* Indeling */
.shell{display:grid; grid-template-columns:220px minmax(0,1fr) minmax(0,46%); height:calc(100% - 64px)}
.nav{border-right:1px solid var(--line); padding:14px 10px; overflow-y:auto; display:flex; flex-direction:column; gap:2px}
.nav small{font:700 .66rem/1 var(--f); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); padding:14px 10px 8px; opacity:.8}
.nav button{display:flex; align-items:center; gap:10px; width:100%; border:0; background:none; padding:9px 10px; border-radius:9px; font-weight:500; font-size:.9rem; color:#C3CBD6; cursor:pointer; text-align:left}
.nav button svg{width:17px; height:17px; flex:none; opacity:.85}
.nav button:hover{background:rgba(255,255,255,.04)}
.nav button[aria-current="page"]{background:rgba(207,174,105,.12); color:var(--text)}
.nav button[aria-current="page"] svg{color:var(--gold); opacity:1}
.nav .lock{margin-left:auto; font:700 .6rem/1 var(--f); letter-spacing:.06em; text-transform:uppercase; padding:4px 6px; border-radius:6px; background:rgba(255,255,255,.06); color:var(--muted)}
.main{overflow-y:auto; padding:26px clamp(18px, 3vw, 36px) 80px}
.prev{border-left:1px solid var(--line); background:#07090D; display:flex; flex-direction:column; min-width:0}
.pv-bar{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); font-size:.8rem; color:var(--muted)}
.pv-bar .url{flex:1; padding:6px 12px; border-radius:99px; background:rgba(255,255,255,.04); font-family:var(--mono); font-size:.76rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pv-bar .live{display:inline-flex; align-items:center; gap:6px; color:var(--ok); font-weight:600}
.pv-bar .live i{width:7px; height:7px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 3px rgba(91,211,154,.2)}
.pv-close{display:none}
.pv{flex:1; overflow-y:auto; padding:16px}

/* Panelen */
.intro{display:flex; gap:14px; align-items:flex-start; padding:14px 16px; border-radius:14px; border:1px solid rgba(207,174,105,.3); background:rgba(207,174,105,.07); margin-bottom:22px; font-size:.9rem}
.intro b{display:block}
.intro p{margin:2px 0 0; color:#C3CBD6}
.intro button{margin-left:auto; border:0; background:none; color:var(--muted); cursor:pointer; font-size:1.2rem; line-height:1; padding:2px 4px}
h1.v{font-size:1.6rem; letter-spacing:-.03em; margin:0}
p.vsub{color:var(--muted); margin:6px 0 22px}
.card{border-radius:14px; border:1px solid var(--line); background:var(--card); padding:18px; margin-bottom:14px}
.card h2{font-size:1rem; margin:0 0 12px}
.field{display:grid; gap:6px; margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field label, .lbl{font-size:.78rem; font-weight:600; color:var(--muted)}
.field input, .field textarea, .field select, .inp{width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--line-2); background:var(--bg); outline:none; transition:border-color .2s, box-shadow .2s}
.field textarea{min-height:90px; resize:vertical}
.field input:focus, .field textarea:focus, .field select:focus, .inp:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(207,174,105,.16)}
.cnt{font:500 .72rem var(--mono); color:var(--muted); justify-self:end}
.cnt.over{color:var(--warn)}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.stats{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; margin-bottom:14px}
.stat{border-radius:14px; border:1px solid var(--line); background:var(--card); padding:16px}
.stat span{font-size:.78rem; color:var(--muted)}
.stat b{display:block; font-size:1.7rem; letter-spacing:-.03em; margin-top:4px}
.stat em{font-style:normal; font-size:.74rem; color:var(--ok)}
.tag{display:inline-block; font:600 .66rem/1 var(--f); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:4px 7px; border-radius:6px; background:rgba(255,255,255,.05); margin-left:8px; vertical-align:middle}
.quick{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px}
.quick button{display:flex; align-items:center; gap:10px; padding:12px; border-radius:11px; border:1px solid var(--line); background:rgba(255,255,255,.02); cursor:pointer; text-align:left; font-weight:600; font-size:.88rem}
.quick button:hover{border-color:rgba(207,174,105,.4)}
.quick svg{width:18px; height:18px; color:var(--gold); flex:none}
.list{display:grid; gap:8px}
.item{display:grid; grid-template-columns:minmax(0,1fr) 110px auto; gap:8px; align-items:center}
.item.prod{grid-template-columns:minmax(0,1fr) 92px 112px auto auto}
.del{width:36px; height:36px; border-radius:9px; border:1px solid var(--line-2); background:none; cursor:pointer; color:var(--muted); display:grid; place-items:center}
.del:hover{color:var(--bad); border-color:rgba(240,122,122,.5)}
.del svg{width:16px; height:16px}
.eur{position:relative}
.eur::before{content:"€"; position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:.9rem}
.eur .inp{padding-left:24px}
.step{display:flex; align-items:center; border:1px solid var(--line-2); border-radius:9px; overflow:hidden}
.step button{width:32px; height:36px; border:0; background:rgba(255,255,255,.03); cursor:pointer; font-weight:700}
.step output{min-width:40px; text-align:center; font-family:var(--mono); font-size:.88rem}
.sw{position:relative; width:42px; height:24px; flex:none}
.sw input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; z-index:1}
.sw span{position:absolute; inset:0; border-radius:99px; background:rgba(255,255,255,.12); transition:background .2s}
.sw span::after{content:""; position:absolute; left:3px; top:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .2s}
.sw input:checked + span{background:var(--gold)}
.sw input:checked + span::after{transform:translateX(18px)}
.sw input:focus-visible + span{outline:2px solid var(--gold); outline-offset:2px}
.add{margin-top:10px}
.hrs{display:grid; gap:8px}
.hr{display:grid; grid-template-columns:110px auto 1fr; gap:12px; align-items:center}
.hr .t{display:flex; gap:8px; align-items:center}
.hr .t input{max-width:110px}
.hr .closed{color:var(--muted); font-size:.86rem}
.photos{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px}
.photo{position:relative; aspect-ratio:4/3; border-radius:12px; overflow:hidden; border:2px solid transparent; cursor:pointer; background:#0c0f13 center/cover no-repeat; padding:0}
.photo[aria-pressed="true"]{border-color:var(--gold)}
.photo span{position:absolute; left:8px; bottom:8px; padding:4px 8px; border-radius:99px; font-size:.72rem; font-weight:600; background:rgba(11,14,19,.8)}
.upload{display:grid; place-items:center; text-align:center; gap:4px; border:2px dashed var(--line-2); color:var(--muted); font-size:.8rem; font-weight:600}
.upload svg{width:22px; height:22px; color:var(--gold)}
.colors{display:flex; gap:10px; flex-wrap:wrap}
.colors button{width:38px; height:38px; border-radius:50%; border:3px solid transparent; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.colors button[aria-pressed="true"]{border-color:#fff}
table{width:100%; border-collapse:collapse; font-size:.88rem}
th{text-align:left; font:600 .72rem var(--f); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:0 8px 10px}
td{padding:10px 8px; border-top:1px solid var(--line)}
td select{padding:6px 8px; border-radius:8px; border:1px solid var(--line-2); background:var(--bg)}
.st{display:inline-block; padding:3px 8px; border-radius:99px; font-size:.74rem; font-weight:600}
.st-Nieuw{background:rgba(207,174,105,.16); color:var(--gold)}
.st-In\ behandeling{background:rgba(120,110,255,.18); color:#B3ABFF}
.st-Verzonden{background:rgba(60,190,170,.16); color:#7FE0CF}
.st-Afgerond{background:rgba(91,211,154,.16); color:var(--ok)}
.serp{border-radius:12px; background:#fff; color:#202124; padding:16px; font-family:Arial, sans-serif}
.serp .u{font-size:12px; color:#4d5156}
.serp .t{font-size:19px; color:#1a0dab; margin:3px 0; line-height:1.3}
.serp .d{font-size:13px; color:#4d5156; line-height:1.5}
.locked{display:grid; justify-items:start; gap:12px; padding:26px; border-radius:16px; border:1px solid rgba(207,174,105,.3); background:linear-gradient(180deg, rgba(207,174,105,.08), rgba(207,174,105,.02))}
.locked h2{margin:0; font-size:1.25rem}
.locked p{margin:0; color:#C3CBD6; max-width:52ch}
.locked ul{margin:0; padding-left:18px; color:#C3CBD6}
.toast{position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px); opacity:0; z-index:60; padding:12px 16px; border-radius:12px; background:#1F5C47; color:#EAF7F0; font-weight:600; font-size:.88rem; box-shadow:0 16px 40px -12px rgba(0,0,0,.8); transition:opacity .25s, transform .25s; pointer-events:none; max-width:calc(100% - 32px); text-align:center}
.toast.on{opacity:1; transform:translate(-50%, 0)}
.pv-open{display:none}

/* Voorbeeldsite */
.site{--acc:#CFAE69; border-radius:14px; overflow:hidden; background:#fff; color:#15181d; font-family:var(--f); box-shadow:0 30px 60px -30px rgba(0,0,0,.9)}
.site .flash{animation:flash 1.1s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(207,174,105,0)}20%{box-shadow:0 0 0 4px var(--acc)}100%{box-shadow:0 0 0 0 rgba(207,174,105,0)}}
.s-nav{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; background:#fff; border-bottom:1px solid #eef0f3}
.s-nav b{font-size:.98rem; letter-spacing:-.01em}
.s-nav nav{display:flex; gap:12px; font-size:.76rem; color:#5b6370}
.s-btn{display:inline-block; white-space:nowrap; padding:8px 13px; border-radius:8px; background:var(--acc); color:#111; font-weight:700; font-size:.78rem}
.s-hero{position:relative; padding:44px 20px 40px; color:#fff; background:#111 center/cover no-repeat; isolation:isolate}
.s-hero::before{content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg, rgba(0,0,0,.75), rgba(0,0,0,.25))}
.s-hero h1{font-size:1.7rem; line-height:1.08; letter-spacing:-.03em; margin:0; max-width:16ch; overflow-wrap:anywhere}
.s-hero p{margin:10px 0 16px; opacity:.9; font-size:.9rem; max-width:34ch}
.s-status{display:inline-flex; align-items:center; gap:6px; margin-bottom:12px; padding:5px 10px; border-radius:99px; background:rgba(255,255,255,.14); font-size:.72rem; font-weight:600}
.s-status i{width:7px; height:7px; border-radius:50%; background:#5BD39A}
.s-status.closed i{background:#F07A7A}
.s-sec{padding:22px 20px; border-bottom:1px solid #eef0f3}
.s-sec h2{font-size:1.05rem; margin:0 0 12px; letter-spacing:-.01em}
.s-serv{display:grid; gap:8px}
.s-serv div{display:flex; justify-content:space-between; gap:10px; padding:10px 12px; border-radius:9px; background:#f5f6f8; font-size:.86rem}
.s-serv b{white-space:nowrap}
.s-shop{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px}
.s-prod{border-radius:10px; border:1px solid #eceef2; padding:10px; font-size:.78rem; display:grid; gap:4px}
.s-prod .img{aspect-ratio:1; border-radius:7px; background:linear-gradient(135deg, var(--acc), #e8eaee); opacity:.85}
.s-prod b{font-size:.8rem; overflow-wrap:anywhere}
.s-prod .out{color:#c0392b; font-weight:600}
.s-prod .low{color:#b7791f; font-weight:600}
.s-about p{margin:0; color:#4a5260; font-size:.88rem; white-space:pre-line; overflow-wrap:anywhere}
.s-hours{display:grid; gap:4px; font-size:.84rem}
.s-hours div{display:flex; justify-content:space-between}
.s-hours .today{font-weight:700}
.s-foot{padding:18px 20px; background:#15181d; color:#c9ced6; font-size:.78rem; display:grid; gap:3px}
.s-foot b{color:#fff; font-size:.9rem}

/* Mobiel */
@media (max-width:1100px){
  .shell{grid-template-columns:200px minmax(0,1fr)}
  .prev{position:fixed; inset:0; z-index:40; transform:translateY(100%); transition:transform .35s cubic-bezier(.2,.8,.2,1); border:0}
  .prev.open{transform:none}
  .pv-close{display:inline-flex}
  .pv-open{display:inline-flex; position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); z-index:30; box-shadow:0 14px 34px -10px rgba(207,174,105,.6)}
}
@media (max-width:760px){
  body{overflow:auto}
  html,body{height:auto}
  .dtop{height:auto; flex-wrap:wrap; padding:10px 14px; gap:10px; position:sticky; top:0; background:var(--bg)}
  .dtop .back, .dtop .cta-full{display:none}
  .seg{order:5; width:100%; margin:0}
  .seg button{flex:1}
  .shell{display:block; height:auto}
  .nav{flex-direction:row; overflow-x:auto; border-right:0; border-bottom:1px solid var(--line); padding:10px 12px; gap:6px; position:sticky; top:var(--hh, 104px); background:var(--bg); z-index:15; scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav small{display:none}
  .nav button{width:auto; flex:none; padding:8px 12px; border:1px solid var(--line); white-space:nowrap}
  .main{overflow:visible; padding:20px 16px 110px}
  .stats{grid-template-columns:1fr 1fr}
  .stat:last-child:nth-child(odd){grid-column:1 / -1}
  .quick{grid-template-columns:1fr}
  .photos{grid-template-columns:1fr 1fr}
  .row2{grid-template-columns:1fr}
  .item{grid-template-columns:minmax(0,1fr) 96px auto}
  .item.prod{grid-template-columns:1fr auto auto; grid-template-areas:"n n n" "p s t"}
  .item.prod > :nth-child(1){grid-column:1 / -1}
  .hr{grid-template-columns:96px auto; }
  .hr .t, .hr .closed{grid-column:1 / -1}
  .tbl{overflow-x:auto}
}
@media (max-width:480px){ .s-nav nav{display:none} }
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>
<header class="dtop">
  <a class="brand" href="/" aria-label="StrakWerk, naar de homepage"><span class="strak">STRAK</span><span>WERK</span></a>
  <span class="pill">Demo</span>
  <div class="seg" role="group" aria-label="Niveau van het beheerpaneel">
    <button type="button" data-level="basis" aria-pressed="true">Basis <small>+€50</small></button>
    <button type="button" data-level="pro" aria-pressed="false">Geavanceerd <small>+€75</small></button>
  </div>
  <span class="sp"></span>
  <a class="back" href="/">← Terug naar StrakWerk</a>
  <button class="btn" type="button" id="reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Reset</button>
  <a class="btn btn--gold cta-full" id="want" href="/?preset=beheer#prijzen">Ik wil dit beheerpaneel</a>
</header>

<div class="shell">
  <nav class="nav" id="nav" aria-label="Beheermenu"></nav>
  <main class="main" id="main" tabindex="-1"></main>
  <aside class="prev" id="prev" aria-label="Live voorbeeld van de website">
    <div class="pv-bar"><span class="live"><i></i>Live</span><span class="url" id="pvUrl">jouwgarage.nl</span><button class="btn pv-close" type="button" id="pvClose">Sluiten</button></div>
    <div class="pv" id="pv"></div>
  </aside>
</div>
<button class="btn btn--gold pv-open" type="button" id="pvOpen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Bekijk website</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";
const KEY = "sw-demo-v1";
const ICONS = {
  dash:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  text:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  photo:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  info:'<path d="M3 21h18M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',

function loadUpload(file){
  if (!/^image\//.test(file.type)){ toast("Kies een afbeelding."); return; }
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1400 / img.width), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      S.upload = c.toDataURL("image/jpeg", .8); S.photo = "upload";
      if (!save()){ S.upload = null; S.photo = "goud"; save(); S.upload = c.toDataURL("image/jpeg", .8); S.photo = "upload"; toast("Foto staat erin, maar is te groot om te onthouden na herladen."); }
      renderView(); renderSite(); flash("hero");
    };
    img.onerror = () => toast("Deze afbeelding kan niet worden geladen.");
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

/* Open of dicht */
function isOpenNow(){
  const d = new Date(), i = (d.getDay() + 6) % 7, h = S.hours[i];
  if (!h.open) return false;
  const now = d.getHours() * 60 + d.getMinutes(), m = t => { const [a, b] = String(t || "0:0").split(":"); return +a * 60 + +b; };
  return now >= m(h.from) && now < m(h.to);
}

      <h1>${esc(S.texts.heroTitle)}</h1><p>${esc(S.texts.heroSub)}</p><span class="s-btn">${esc(S.texts.cta)}</span>
    </div>
    <div class="s-sec" data-part="serv"><h2>Diensten en prijzen</h2><div class="s-serv">${S.services.map(s => `<div><span>${esc(s.name)}</span><b>€ ${esc(s.price)}</b></div>`).join("") || '<div><span>Nog geen diensten</span></div>'}</div></div>
    ${shop.length ? `<div class="s-sec" data-part="shop"><h2>Webshop</h2><div class="s-shop">${shop.map(p => `<div class="s-prod"><div class="img"></div><b>${esc(p.name)}</b><span>€ ${esc(p.price)}</span>${+p.stock === 0 ? '<span class="out">Uitverkocht</span>' : +p.stock <= 3 ? `<span class="low">Nog ${p.stock} op voorraad</span>` : "<span>Op voorraad</span>"}</div>`).join("")}</div></div>` : ""}
    <div class="s-sec s-about" data-part="about"><h2>Over ons</h2><p>${esc(S.texts.about)}</p></div>
    <div class="s-sec" data-part="hours"><h2>Openingstijden</h2><div class="s-hours">${DAYS.map((d, i) => { const h = S.hours[i]; return `<div class="${i === today ? "today" : ""}"><span>${d}</span><span>${h.open ? `${esc(h.from)} – ${esc(h.to)}` : "Gesloten"}</span></div>`; }).join("")}</div></div>
    <div class="s-foot" data-part="foot"><b>${esc(S.biz.name)}</b><span>${esc(S.biz.phone)} · ${esc(S.biz.email)}</span><span>${esc(S.biz.address)}</span></div>
  </div>`;
}

/* Voorbeeld op mobiel */
const prev = $("#prev");
$("#pvOpen").addEventListener("click", () => { prev.classList.add("open"); $("#pvClose").focus(); });
$("#pvClose").addEventListener("click", () => { prev.classList.remove("open"); $("#pvOpen").focus(); });
addEventListener("keydown", e => { if (e.key === "Escape" && prev.classList.contains("open")) prev.classList.remove("open"); });

$("#reset").addEventListener("click", () => {
  const keepIntro = S.introClosed; S = DEFAULT(); S.introClosed = keepIntro;
  try { localStorage.removeItem(KEY); } catch (e) {}
  setLevel("basis"); toast("De demo staat weer zoals in het begin.");
});

const top = document.querySelector(".dtop");
const setHH = () => document.documentElement.style.setProperty("--hh", top.offsetHeight + "px");
setHH(); addEventListener("resize", setHH);
if (!VIEWS.some(v => v.id === S.view)) S.view = "dash";
setLevel(S.level === "pro" ? "pro" : "basis");
})();
</script>
</body>
</html>
