<!doctype html>
<html lang="nl">
<head>

<title>Intake · StrakWerk</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/intake/intake.css">

<body>
<main class="in">
  <header class="in-top"><span class="logo">STRAK<b>WERK</b></span><span class="kicker">Intake</span></header>
  <section id="state" class="in-card" aria-live="polite"><p>Even laden…</p></section>
  <form id="form" class="in-card" hidden novalidate>
    <h1 id="title">Je materiaal voor de website</h1>
    <p id="intro" class="muted"></p>
    <div class="bar" role="progressbar" aria-valuemin="0" id="bar"><i></i></div>
    <p id="progress" class="muted small"></p>
    <div id="fields"></div>
    <button type="submit" class="btn">Opslaan</button>
    <p id="msg" class="small" role="status"></p>
  </form>
  <p class="foot small muted">Deze link is persoonlijk en geeft alleen toegang tot jouw project. Vragen? Stuur Rayan een WhatsApp.</p>
</main>
<script src="/assets/intake/intake.js" defer></script>
